<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간단 메모장</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#222;font:16px system-ui,sans-serif}main{max-width:560px;margin:32px auto;padding:0 16px}h1{font-size:24px}.card{border:1px solid #ddd;border-radius:10px;padding:18px;margin:16px 0}input,textarea,button{font:inherit}input,textarea{display:block;width:100%;padding:10px;margin:8px 0 12px;border:1px solid #aaa;border-radius:6px}textarea{min-height:120px;resize:vertical}button{padding:10px 16px;border:0;border-radius:6px;background:#2456bb;color:white;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.muted{color:#666}#message{min-height:24px;color:#a02}ul{list-style:none;padding:0}li{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid #ddd;padding:12px 0}li button{display:block;margin-top:8px;background:#666}
</style>
<main>
<h1>간단 메모장</h1>
<p id="message" role="status" aria-live="polite"></p>
<section id="auth" class="card" hidden>
  <form id="auth-form">
    <label>이메일<input id="email" type="email" autocomplete="email" required></label>
    <label>비밀번호<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <button id="login" type="submit">로그인</button>
    <button id="signup" type="button">회원가입</button>
  </form>
</section>
<section id="notes" hidden>
  <button id="logout">로그아웃</button>
  <div class="card">
    <label for="content">메모 내용</label>
    <textarea id="content" maxlength="10000"></textarea>
    <button id="save">저장</button>
  </div>
  <div class="card"><h2>내 메모</h2><ul id="list"></ul></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const db = supabase.createClient('https://wjzzgeqzazdtmssweliu.supabase.co', 'sb_publishable_rcfT3LMyCcC9EEYcrZyN-g_rm0MzSOZ');
const $ = id => document.getElementById(id);
let user = null;
function message(text) { $('message').textContent = text || ''; }
function error(err) { message(err?.message || '오류가 발생했습니다. 다시 시도해 주세요.'); }
function busy(on) { ['login','signup','save','logout'].forEach(id => $(id).disabled = on); }
async function refresh() {
  const {data:{user:current},error:err} = await db.auth.getUser();
  user = current;
  $('auth').hidden = !!user;
  $('notes').hidden = !user;
  if (err && err.name !== 'AuthSessionMissingError') error(err);
  if (user) await load();
}
async function load() {
  const {data,error:err} = await db.from('memos').select('id,content').order('created_at',{ascending:false});
  if (err) return error(err);
  $('list').replaceChildren();
  for (const memo of data) {
    const li = document.createElement('li');
    const text = document.createElement('div');
    text.textContent = memo.content;
    const del = document.createElement('button');
    del.type = 'button'; del.textContent = '삭제';
    del.onclick = async () => {
      del.disabled = true; message('삭제 중...');
      const {error:removeError} = await db.from('memos').delete().eq('id',memo.id).eq('user_id',user.id);
      if (removeError) { del.disabled = false; return error(removeError); }
      message('삭제했습니다.'); await load();
    };
    li.append(text,del); $('list').append(li);
  }
}
async function authenticate(signup) {
  busy(true); message('처리 중...');
  const input = {email:$('email').value.trim(),password:$('password').value};
  const {data,error:err} = signup ? await db.auth.signUp(input) : await db.auth.signInWithPassword(input);
  busy(false);
  if (err) return error(err);
  if (!data.session) return message('이메일 확인이 필요합니다. 관리자에게 설정을 확인해 주세요.');
  $('password').value = ''; message('로그인했습니다.'); await refresh();
}
$('auth-form').onsubmit = e => { e.preventDefault(); authenticate(false); };
$('signup').onclick = () => authenticate(true);
$('logout').onclick = async () => {
  busy(true); const {error:err} = await db.auth.signOut(); busy(false);
  if (err) return error(err);
  $('list').replaceChildren(); $('content').value = ''; message('로그아웃했습니다.'); await refresh();
};
$('save').onclick = async () => {
  const content = $('content').value.trim();
  if (!content) return message('메모 내용을 입력해 주세요.');
  busy(true); message('저장 중...');
  const {error:err} = await db.from('memos').insert({user_id:user.id,content});
  busy(false);
  if (err) return error(err);
  $('content').value = ''; message('저장했습니다.'); await load();
};
db.auth.onAuthStateChange(() => { setTimeout(refresh,0); });
refresh();
</script>
</html>
